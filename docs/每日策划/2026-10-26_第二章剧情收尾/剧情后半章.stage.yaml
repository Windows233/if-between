decisions:
- id: resolved_rules
  question: 回溯、决策币与隐蔽采用哪版？
  blocking: false
  affects:
  - L07
  - L11
  - L26
  - L31
  resolution: 已审核R2：决策币统一；恢复个人与随身锚点，记忆/地图血迹保留；隐蔽在逃跑中想到后由玩家主动F。
- id: exit_route
  question: 抛币后如何离界？
  blocking: false
  affects:
  - L31
  - L32
  resolution: 沿用10/25确认及main现有直切market_night/from_overworld，不增加监控、走廊、第三段追逐或主角跳窗。
- id: minimal_box
  question: 今日是否新增盒子小游戏？
  blocking: false
  affects:
  - L14
  - L15
  resolution: 原P609为“可以”；今日保留main已有线索条件解锁+E开盒，完成正文，不新造机制。
- id: window_binding
  question: main旧窗与本地新窗不一致？
  blocking: false
  affects:
  - L30
  - L31
  resolution: 两版静态可达已核；程序按classroom_window的实际交付版本解析，不覆盖并行编辑。今日文字标记+现成CG，模块窗后补，不等待美术。
- id: placeholder_art
  question: 专用打斗/赠币回忆/倒架/可见窗缺图会阻塞吗？
  blocking: false
  affects:
  - L21
  - L29
  - L30
  resolution: 本轮用户要求今日完成剧情且美术不阻塞，采用已存在道具、立绘、CG及横放书架占位；美术另出同锚点替换件。
- id: end6_and_b
  question: 失败线与P747/748交付规则？
  blocking: false
  affects:
  - L19
  - L24
  - L34
  resolution: 保留P667在闪避失败；追逐被捕沿用main重试/接受End6。P747吊坠幂等，P748对话索要后移除night_tear；不复用meet_b或ch2_market的A剧情。
entry: L01
nodes:
- id: L01
  title: 首次入馆与个人锚点
  sources:
  - r2
  - rules
  - main
  scene: library
  trigger:
    type: flow
    target: ch2_diary/library_enter→library_state
  control: cutscene
  repeat: guarded
  repeat_notes: 按已有进度flag分流；调查可重复，奖励、首次锚点、结局和交付只生效一次；存档重播不得再次发物。
  setup:
    camera: inherit：沿用当前地图合法焦点，若有image用屏幕叠层；具体切镜见cue。
    characters: inherit：保留互动时主角脚点与朝向，不为对话瞬移；C只在图书馆/追逐，B只在夜市，老人只在委托屋。
    environment: inherit：地图及碰撞保持；本节点新增/撤销的层见cue。
    audio: inherit：地图BGM；每次换曲、停曲和短音效单列。
  native_binding: ch2_diary/library_enter→library_state
  source_paragraphs: P518—P519
  cues:
  - id: L01_C01
    kind: ui
    origin: staging
    sources:
    - main
    - today
    description: 只在首次入馆建立个人锚点；复用已有调用，不重复记录。
    completion: immediate
    engine:
      status: existing
      steps:
      - do: personal_anchor
      notes: ch2_diary/library_enter→library_state；按本cue顺序落地；不是YAML直接执行。
    params:
      operation: anchor_guard
      once: true
  - id: L01_C02
    kind: caption
    origin: source
    sources:
    - r2
    - main
    description: ？月 ？日 图书馆 深夜
    completion: confirm
    engine:
      status: existing
      steps:
      - do: say
        text: ？月 ？日 图书馆 深夜
      notes: ch2_diary/library_enter→library_state；按本cue顺序落地；不是YAML直接执行。
    params:
      text: ？月 ？日 图书馆 深夜
