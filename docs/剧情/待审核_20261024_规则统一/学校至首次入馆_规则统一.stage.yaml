      "question": "教室黑板/日记桌交互框与家具碰撞尚未在编辑器绑定",
      "blocking": true,
      "affects": [
        "board_read",
        "diary_check",
        "diary_first"
      ],
      "resolution": null
    },
    {
      "id": "qte_policy",
      "question": "新版强制失败与既定双QTE如何统一？",
      "blocking": false,
      "affects": [
        "chase_prepare",
        "run_q1",
        "run_q2",
        "arrive",
        "c_door_cover",
        "library_enter",
        "library_explore",
        "chase_caught"
      ],
      "resolution": "用户2026-10-24明确选择双QTE可赢、C在门口接应；不保留固定乱码、不可赢第三段或靠C判胜。"
    },
    {
      "id": "coin_flow",
      "question": "强制组队后无币如何处理？",
      "blocking": false,
      "affects": [
        "join_c",
        "chase_prepare",
        "c_door_cover"
      ],
      "resolution": "强制组队正常流程必得同一个决策币；旧档缺币通过迁移/补交解决，不增设正常无币死亡。不把同一旧礼物和决策币各发一次。"
    },
    {
      "id": "approved_concealment",
      "question": "隐蔽何时启动？",
      "blocking": false,
      "affects": [
        "chase_prepare",
        "library_enter"
      ],
      "resolution": "第一次黑猫追逐没有夜幕之泪，不使用隐蔽。后段主角先凭防备躲刀，掀翻书架脱身，再在逃离C的途中主动驱动夜幕之泪；不是闪避被动触发。"
    },
    {
      "id": "approved_personal_rewind",
      "question": "主角随身状态与地图血迹如何回溯？",
      "blocking": false,
      "affects": [
        "library_enter"
      ],
      "resolution": "沿用首次入馆的个人锚点，恢复主角自身及随身物品的锚点状态，主角记忆保留。身体/衣物上仍附着的血迹随个人表现重置；已经溅到地图上的血迹离开了主角，不随个人回溯重置。不使用整图清空替代个人恢复。"
    }
  ],
